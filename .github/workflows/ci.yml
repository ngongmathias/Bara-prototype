name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p .

      # Rules of Hooks only — see eslint.hooks.config.js for why this is
      # deliberately narrow rather than the full lint config.
      - name: Rules of Hooks
        run: npx eslint src --config eslint.hooks.config.js --max-warnings=-1
